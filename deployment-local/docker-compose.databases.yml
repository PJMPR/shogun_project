# docker-compose.databases.yml
# Lokalny stack baz danych: MariaDB, MongoDB i jednorazowy init MongoDB.
#
# Pierwsze uruchomienie:
#   docker compose -f docker-compose.databases.yml --env-file .env.local up -d
#
# Bazy sa eksponowane na porty hosta -- mozesz laczyc sie np. przez DBeaver / Compass.
# Siec shogun_local_network jest tworzona tutaj i uzywana przez pozostale compose.

services:

  # PostgreSQL — baza planów zajęć (Schedule API)
  postgres-schedule:
    image: postgres:17-alpine
    container_name: pj_postgres_schedule
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SCHEDULE_POSTGRES_DB:-pj_schedule}
      POSTGRES_USER: ${SCHEDULE_POSTGRES_USER:-shogun_schedule}
      POSTGRES_PASSWORD: ${SCHEDULE_POSTGRES_PASSWORD:-schedule_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_schedule_data:/var/lib/postgresql/data
    networks:
      - shogun_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── MariaDB ──────────────────────────────────────────────────────────────
  # Bazy: shogun_users (Keycloak + Users API), pj_assignments (Assignments API)
  mariadb:
    image: mariadb:11
    container_name: pj_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-password}
      MARIADB_DATABASE: shogun_users
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../backend/init-mariadb:/docker-entrypoint-initdb.d:ro
    networks:
      - shogun_local
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── MongoDB ───────────────────────────────────────────────────────────────
  # Baza: pj_sylabi (Syllabi API)
  mongo:
    image: mongo:7
    container_name: pj_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-haslo123}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - shogun_local
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Jednorazowy init MongoDB (dane sylabusy) ──────────────────────────────
  mongo-init:
    image: node:22-alpine
    container_name: pj_mongo_init
    working_dir: /app
    volumes:
      - ../database/mongo:/app
      - ../frontend/public/assets:/frontend/public/assets:ro
    environment:
      MONGO_URI: "mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-haslo123}@pj_mongo:27017/?authSource=admin"
      MONGO_DB: "${MONGO_DB:-pj_sylabi}"
    command: sh -c "npm install --silent && node init-db.mjs"
    networks:
      - shogun_local
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

networks:
  shogun_local:
    name: shogun_local_network

volumes:
  mariadb_data:
  mongo_data:
  postgres_schedule_data:
