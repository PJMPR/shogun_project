# HTTP → HTTPS redirect
server {
    listen 80;
    server_name shogun.pjwstk.edu.pl;
    return 301 https://shogun.pjwstk.edu.pl:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name shogun.pjwstk.edu.pl;

    # Docker internal DNS – re-resolve upstreams every 30 s (fixes stale IP after container rebuild)
    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/nginx/certs/shogun.pjwstk.edu.pl.pem;
    ssl_certificate_key /etc/nginx/certs/shogun.pjwstk.edu.pl-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Keycloak ──────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass         http://pj_keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  8443;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── Backend API (syllabi) ─────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://pj_syllabi_api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Assignments API ───────────────────────────────────────────────────
    location /api-assignments/ {
        proxy_pass         http://pj_assignments_api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Users API ─────────────────────────────────────────────────────────
    location /api-users/ {
        proxy_pass         http://pj_users_api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Shared static assets (JSON configs, etc.) ─────────────────────────
    location /assets/ {
        alias /usr/share/nginx/assets/;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Static files (syllabus PDFs, DOCX) ───────────────────────────────
    location /files/ {
        proxy_pass         http://pj_files:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        add_header         Access-Control-Allow-Origin *;
    }

    # ── Micro-frontends ───────────────────────────────────────────────────
    location /mfe-program/ {
        proxy_pass         http://pj_mfe_program:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /mfe-syllabi/ {
        proxy_pass         http://pj_mfe_syllabi:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /mfe-assignements/ {
        proxy_pass         http://pj_mfe_assignements:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /mfe-users/ {
        proxy_pass         http://pj_mfe_users:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /mfe-lecturers-assignments/ {
        proxy_pass         http://pj_mfe_lecturers_assignments:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # ── Host Angular app (catch-all) ──────────────────────────────────────
    location / {
        proxy_pass         http://pj_mfe_host:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
