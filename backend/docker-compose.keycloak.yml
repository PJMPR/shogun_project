# docker-compose.keycloak.yml
# Keycloak dla środowiska deweloperskiego.
#
# Wymagania:
#   - MariaDB działa lokalnie (nie w Docker) z bazą shogun_users
#   - Baza shogun_users istnieje (patrz backend/README-keycloak-setup.md)
#
# Uruchomienie:
#   docker compose -f docker-compose.keycloak.yml up -d
#
# Zatrzymanie (kontener zachowany):
#   docker compose -f docker-compose.keycloak.yml stop
#
# Keycloak Admin Console:
#   http://localhost:8180/auth/admin
#   Login / hasło: KC_ADMIN_USER / KC_ADMIN_PASS z .env (domyślnie: admin / admin_pass)

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: pj_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://host.docker.internal:3306/shogun_users
      KC_DB_USERNAME: ${KC_DB_USER:-root}
      KC_DB_PASSWORD: ${KC_DB_PASS:-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASS:-admin_pass}
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8180:8080"
