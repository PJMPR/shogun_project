services:

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: pj_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://host.docker.internal:3306/shogun_users
      KC_DB_USERNAME: ${KC_DB_USER:-root}
      KC_DB_PASSWORD: ${KC_DB_PASS:-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASS:-admin_pass}
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8180:8080"

  proxy:
    image: nginx:alpine
    container_name: pj_proxy
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/public/assets:/usr/share/nginx/assets:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api
      - assignments-api
      - mfe-host
      - mfe-program
      - mfe-syllabi
      - mfe-assignements
      - files
      - keycloak

  api:
    build:
      context: ./Shogun.ProgramData.Service
      dockerfile: Shogun.Service.Api/Dockerfile
    container_name: pj_syllabi_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MONGODB__CONNECTIONSTRING: "mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-haslo123}@host.docker.internal:27017/?authSource=admin"
      MONGODB__DATABASENAME: "${MONGO_DB:-pj_sylabi}"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://shogun.pjwstk.edu.pl:8443/auth/realms/shogun"
    depends_on:
      - keycloak

  assignments-api:
    build:
      context: ./Shogun.Assignments
      dockerfile: Shogun.Assignments.Service.Api/Dockerfile
    container_name: pj_assignments_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MARIADB__CONNECTIONSTRING: "Server=host.docker.internal;Port=3306;Database=pj_assignments;User Id=root;Password=password;"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://shogun.pjwstk.edu.pl:8443/auth/realms/shogun"
    depends_on:
      - keycloak

  mfe-host:
    build:
      context: ../frontend/pj-studies-host
      dockerfile: Dockerfile
    container_name: pj_mfe_host
    restart: unless-stopped

  mfe-program:
    build:
      context: ../frontend/pj-studies-program
      dockerfile: Dockerfile
    container_name: pj_mfe_program
    restart: unless-stopped

  mfe-syllabi:
    build:
      context: ../frontend/pj-studies-syllabi
      dockerfile: Dockerfile
    container_name: pj_mfe_syllabi
    restart: unless-stopped

  mfe-assignements:
    build:
      context: ../frontend/pj-studies-assignements
      dockerfile: Dockerfile
    container_name: pj_mfe_assignements
    restart: unless-stopped

  files:
    image: nginx:alpine
    container_name: pj_files
    restart: unless-stopped
    volumes:
      - ./files:/usr/share/nginx/html:ro

volumes:
  mongo_data:
