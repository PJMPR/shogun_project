# Keycloak jest w osobnym pliku: docker-compose.keycloak.yml
# Bazy danych są w osobnym pliku: docker-compose.databases.yml
#
# Uruchomienie pełnego dev-stacka:
#   docker compose -f docker-compose.keycloak.yml up -d
#   docker compose -f docker-compose.yml up -d

services:

  # ── MariaDB ──────────────────────────────────────────────────────────────
  # mariadb:
  #   image: mariadb:11
  #   container_name: pj_mariadb
  #   restart: unless-stopped
  #   environment:
  #     MARIADB_ROOT_PASSWORD: password
  #     MARIADB_DATABASE: shogun_users
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mariadb_data:/var/lib/mysql
  #     - ./init-keycloak-user.sql:/docker-entrypoint-initdb.d/init-keycloak-user.sql:ro

  # # ── MongoDB ──────────────────────────────────────────────────────────────
  # mongo:
  #   image: mongo:7
  #   container_name: pj_mongo
  #   restart: unless-stopped
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: haslo123
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongo_data:/data/db

  proxy:
    image: nginx:alpine
    container_name: pj_proxy
    restart: unless-stopped
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/public/assets:/usr/share/nginx/assets:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api
      - assignments-api
      - users-api
      - mfe-host
      - mfe-program
      - mfe-syllabi
      - mfe-assignements
      - mfe-users
      - files

  api:
    build:
      context: ./Shogun.ProgramData.Service
      dockerfile: Shogun.Service.Api/Dockerfile
    container_name: pj_syllabi_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MONGODB__CONNECTIONSTRING: "mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-haslo123}@host.docker.internal:27017/?authSource=admin"
      MONGODB__DATABASENAME: "${MONGO_DB:-pj_sylabi}"
      KEYCLOAK__METADATAADDRESS: "http://host.docker.internal:8180/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://shogun.pjwstk.edu.pl:8443/auth/realms/shogun"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  assignments-api:
    build:
      context: ./Shogun.Assignments
      dockerfile: Shogun.Assignments.Service.Api/Dockerfile
    container_name: pj_assignments_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MARIADB__CONNECTIONSTRING: "Server=host.docker.internal;Port=3306;Database=pj_assignments;User Id=root;Password=password;"
      KEYCLOAK__METADATAADDRESS: "http://host.docker.internal:8180/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://shogun.pjwstk.edu.pl:8443/auth/realms/shogun"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  users-api:
    build:
      context: ./Shogun.Users
      dockerfile: Shogun.Users.Api/Dockerfile
    container_name: pj_users_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MARIADB__CONNECTIONSTRING: "Server=host.docker.internal;Port=3306;Database=shogun_users;User Id=root;Password=password;"
      KEYCLOAK__METADATAADDRESS: "http://host.docker.internal:8180/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://shogun.pjwstk.edu.pl:8443/auth/realms/shogun"
      KEYCLOAK__ADMINBASEURL: "http://host.docker.internal:8180"
      KEYCLOAK__REALM: "shogun"
      KEYCLOAK__CLIENTID: "shogun-users-service"
      KEYCLOAK__CLIENTSECRET: "${USERS_SERVICE_CLIENT_SECRET:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mfe-host:
    build:
      context: ../frontend/pj-studies-host
      dockerfile: Dockerfile
    container_name: pj_mfe_host
    restart: unless-stopped

  mfe-program:
    build:
      context: ../frontend/pj-studies-program
      dockerfile: Dockerfile
    container_name: pj_mfe_program
    restart: unless-stopped

  mfe-syllabi:
    build:
      context: ../frontend/pj-studies-syllabi
      dockerfile: Dockerfile
    container_name: pj_mfe_syllabi
    restart: unless-stopped

  mfe-assignements:
    build:
      context: ../frontend/pj-studies-assignements
      dockerfile: Dockerfile
    container_name: pj_mfe_assignements
    restart: unless-stopped

  mfe-users:
    build:
      context: ../frontend/pj-studies-users
      dockerfile: Dockerfile
    container_name: pj_mfe_users
    restart: unless-stopped

  files:
    image: nginx:alpine
    container_name: pj_files
    restart: unless-stopped
    volumes:
      - ./files:/usr/share/nginx/html:ro


