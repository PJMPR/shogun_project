# nginx.prod.conf
# Produkcyjna konfiguracja nginx dla serwera GDA-Shogun.
# Porty publiczne: 80 (HTTP->HTTPS redirect) i 443 (HTTPS).
# Certyfikat: Let's Encrypt przez Certbot.

# HTTP -- redirect na HTTPS i obsluga Certbot challenge
server {
    listen 80;
    server_name shogun.pjwstk.edu.pl shogun.pja.edu.pl;

    # Certbot ACME challenge -- wymagane do odnowienia certyfikatu
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name shogun.pjwstk.edu.pl shogun.pja.edu.pl;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Keycloak ──────────────────────────────────────────────────────────
    location /auth/ {
        proxy_pass         http://pj_keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
    }

    # ── Syllabi API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://pj_syllabi_api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Assignments API ───────────────────────────────────────────────────
    location /api-assignments/ {
        proxy_pass         http://pj_assignments_api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Users API ─────────────────────────────────────────────────────────
    location /api-users/ {
        proxy_pass         http://pj_users_api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static assets ─────────────────────────────────────────────────────
    location /assets/ {
        alias /usr/share/nginx/assets/;
        add_header Access-Control-Allow-Origin *;
    }

    # ── Static files (PDFs) ───────────────────────────────────────────────
    location /files/ {
        proxy_pass         http://pj_files:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        add_header         Access-Control-Allow-Origin *;
    }

    # ── Micro-frontends ───────────────────────────────────────────────────
    location /mfe-program/ {
        proxy_pass         http://pj_mfe_program:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location /mfe-syllabi/ {
        proxy_pass         http://pj_mfe_syllabi:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location /mfe-assignements/ {
        proxy_pass         http://pj_mfe_assignements:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location /mfe-users/ {
        proxy_pass         http://pj_mfe_users:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # ── Host app (catch-all) ──────────────────────────────────────────────
    location / {
        proxy_pass         http://pj_mfe_host:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
