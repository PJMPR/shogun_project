# docker-compose.prod.yml
# Produkcyjny stack aplikacji Shogun bez baz danych i Keycloak.
#
# Bazy danych uruchamia docker-compose.databases.prod.yml.
# Keycloak uruchamia docker-compose.keycloak.prod.yml.
# Ten plik uruchamia tylko API, frontend, pliki statyczne i proxy.
#
# Redeploy (bazy i Keycloak nieruszone):
#   ./deploy.sh
#
# Wymagania:
#   1. Bazy musza dzialac (docker-compose.databases.prod.yml up)
#   2. Keycloak musi dzialac (docker-compose.keycloak.prod.yml up)
#   3. Terraform musi byc zastosowany (realm shogun + client secrets)
#   4. Siec shogun_network musi istniec (tworzona przez databases compose)
#   5. Certyfikat TLS w ./certs/
#   6. Plik .env.prod uzupelniony wartosciami

services:

  api:
    build:
      context: ../backend/Shogun.ProgramData.Service
      dockerfile: Shogun.Service.Api/Dockerfile
    container_name: pj_syllabi_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MONGODB__CONNECTIONSTRING: "mongodb://${MONGO_USER}:${MONGO_PASS}@pj_mongo:27017/?authSource=admin"
      MONGODB__DATABASENAME: "${MONGO_DB:-pj_sylabi}"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://${DOMAIN}/auth/realms/shogun"
    networks:
      - shogun

  assignments-api:
    build:
      context: ../backend/Shogun.Assignments
      dockerfile: Shogun.Assignments.Service.Api/Dockerfile
    container_name: pj_assignments_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MARIADB__CONNECTIONSTRING: "Server=pj_mariadb;Port=3306;Database=pj_assignments;User Id=root;Password=${MARIADB_ROOT_PASSWORD};"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://${DOMAIN}/auth/realms/shogun"
      KEYCLOAK__ADMINBASEURL: "http://pj_keycloak:8080"
      KEYCLOAK__REALM: "shogun"
      KEYCLOAK__CLIENTID: "shogun-users-service"
      KEYCLOAK__CLIENTSECRET: "${USERS_SERVICE_CLIENT_SECRET}"
    networks:
      - shogun

  users-api:
    build:
      context: ../backend/Shogun.Users
      dockerfile: Shogun.Users.Api/Dockerfile
    container_name: pj_users_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MARIADB__CONNECTIONSTRING: "Server=pj_mariadb;Port=3306;Database=shogun_users;User Id=root;Password=${MARIADB_ROOT_PASSWORD};"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://${DOMAIN}/auth/realms/shogun"
      KEYCLOAK__ADMINBASEURL: "http://pj_keycloak:8080"
      KEYCLOAK__REALM: "shogun"
      KEYCLOAK__CLIENTID: "shogun-users-service"
      KEYCLOAK__CLIENTSECRET: "${USERS_SERVICE_CLIENT_SECRET}"
    networks:
      - shogun

  schedule-api:
    build:
      context: ../backend/Shogun.Schedule
      dockerfile: Shogun.Schedule.Api/Dockerfile
    container_name: pj_schedule_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      POSTGRES__CONNECTIONSTRING: "Host=pj_postgres_schedule;Port=5432;Database=${SCHEDULE_POSTGRES_DB};Username=${SCHEDULE_POSTGRES_USER};Password=${SCHEDULE_POSTGRES_PASSWORD}"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://${DOMAIN}/auth/realms/shogun"
      KEYCLOAK__ADMINBASEURL: "http://pj_keycloak:8080"
      KEYCLOAK__REALM: "shogun"
      KEYCLOAK__CLIENTID: "shogun-users-service"
      KEYCLOAK__CLIENTSECRET: "${USERS_SERVICE_CLIENT_SECRET}"
      USERSAPIBASEURL: "http://pj_users_api:8080"
    networks:
      - shogun

  mfe-host:
    build:
      context: ../frontend/pj-studies-host
      dockerfile: Dockerfile
    container_name: pj_mfe_host
    restart: unless-stopped
    networks:
      - shogun

  mfe-program:
    build:
      context: ../frontend/pj-studies-program
      dockerfile: Dockerfile
    container_name: pj_mfe_program
    restart: unless-stopped
    networks:
      - shogun

  mfe-syllabi:
    build:
      context: ../frontend/pj-studies-syllabi
      dockerfile: Dockerfile
    container_name: pj_mfe_syllabi
    restart: unless-stopped
    networks:
      - shogun

  mfe-assignements:
    build:
      context: ../frontend/pj-studies-assignements
      dockerfile: Dockerfile
    container_name: pj_mfe_assignements
    restart: unless-stopped
    networks:
      - shogun

  mfe-users:
    build:
      context: ../frontend/pj-studies-users
      dockerfile: Dockerfile
    container_name: pj_mfe_users
    restart: unless-stopped
    networks:
      - shogun

  mfe-lecturers-assignments:
    build:
      context: ../frontend/pj-studies-lecturers-assignments
      dockerfile: Dockerfile
    container_name: pj_mfe_lecturers_assignments
    restart: unless-stopped
    networks:
      - shogun

  mfe-schedule:
    build:
      context: ../frontend/pj-studies-schedule
      dockerfile: Dockerfile
    container_name: pj_mfe_schedule
    restart: unless-stopped
    networks:
      - shogun

  mfe-lecturer-schedule:
    build:
      context: ../frontend/pj-studies-lecturer-schedule
      dockerfile: Dockerfile
    container_name: pj_mfe_lecturer_schedule
    restart: unless-stopped
    networks:
      - shogun

  files:
    image: nginx:alpine
    container_name: pj_files
    restart: unless-stopped
    volumes:
      - ../backend/files:/usr/share/nginx/html:ro
    networks:
      - shogun

  proxy:
    image: nginx:alpine
    container_name: pj_proxy
    restart: unless-stopped
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/public/assets:/usr/share/nginx/assets:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - shogun
    depends_on:
      - api
      - assignments-api
      - users-api
      - schedule-api
      - mfe-host
      - mfe-program
      - mfe-syllabi
      - mfe-assignements
      - mfe-users
      - mfe-lecturers-assignments
      - mfe-schedule
      - mfe-lecturer-schedule
      - files

networks:
  shogun:
    name: shogun_network
    external: true  # siec tworzona przez docker-compose.databases.prod.yml
