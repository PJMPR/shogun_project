# docker-compose.prod.yml
# Produkcyjny stack aplikacji Shogun.
# Bazy danych sa w docker-compose.databases.prod.yml -- uruchom je WCZESNIEJ.
#
# Pierwsze uruchomienie:
#   docker compose -f docker-compose.databases.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Redeploy (bazy nieruszone):
#   ./deploy.sh
#
# Wymagania:
#   1. Bazy musza dzialac (docker-compose.databases.prod.yml up)
#   2. Siec shogun_network musi istniec (tworzona przez databases compose)
#   3. Certyfikat TLS w ./certs/
#   4. Plik .env.prod uzupelniony wartosciami

services:

  # keycloak laczy sie z mariadb przez siec shogun_network
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: pj_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://pj_mariadb:3306/shogun_users
      KC_DB_USERNAME: ${KC_DB_USER:-root}
      KC_DB_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASS}
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: "true"
    networks:
      - shogun

  api:
    build:
      context: ../backend/Shogun.ProgramData.Service
      dockerfile: Shogun.Service.Api/Dockerfile
    container_name: pj_syllabi_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MONGODB__CONNECTIONSTRING: "mongodb://${MONGO_USER}:${MONGO_PASS}@pj_mongo:27017/?authSource=admin"
      MONGODB__DATABASENAME: "${MONGO_DB:-pj_sylabi}"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://${DOMAIN}/auth/realms/shogun"
    networks:
      - shogun
    depends_on:
      - keycloak

  assignments-api:
    build:
      context: ../backend/Shogun.Assignments
      dockerfile: Shogun.Assignments.Service.Api/Dockerfile
    container_name: pj_assignments_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MARIADB__CONNECTIONSTRING: "Server=pj_mariadb;Port=3306;Database=pj_assignments;User Id=root;Password=${MARIADB_ROOT_PASSWORD};"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://${DOMAIN}/auth/realms/shogun"
    networks:
      - shogun
    depends_on:
      - keycloak

  users-api:
    build:
      context: ../backend/Shogun.Users
      dockerfile: Shogun.Users.Api/Dockerfile
    container_name: pj_users_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MARIADB__CONNECTIONSTRING: "Server=pj_mariadb;Port=3306;Database=shogun_users;User Id=root;Password=${MARIADB_ROOT_PASSWORD};"
      KEYCLOAK__METADATAADDRESS: "http://pj_keycloak:8080/auth/realms/shogun/.well-known/openid-configuration"
      KEYCLOAK__VALIDISSUERS__0: "https://${DOMAIN}/auth/realms/shogun"
      KEYCLOAK__ADMINBASEURL: "http://pj_keycloak:8080"
      KEYCLOAK__REALM: "shogun"
      KEYCLOAK__CLIENTID: "shogun-users-service"
      KEYCLOAK__CLIENTSECRET: "${USERS_SERVICE_CLIENT_SECRET}"
    networks:
      - shogun
    depends_on:
      - keycloak

  mfe-host:
    build:
      context: ../frontend/pj-studies-host
      dockerfile: Dockerfile
    container_name: pj_mfe_host
    restart: unless-stopped
    networks:
      - shogun

  mfe-program:
    build:
      context: ../frontend/pj-studies-program
      dockerfile: Dockerfile
    container_name: pj_mfe_program
    restart: unless-stopped
    networks:
      - shogun

  mfe-syllabi:
    build:
      context: ../frontend/pj-studies-syllabi
      dockerfile: Dockerfile
    container_name: pj_mfe_syllabi
    restart: unless-stopped
    networks:
      - shogun

  mfe-assignements:
    build:
      context: ../frontend/pj-studies-assignements
      dockerfile: Dockerfile
    container_name: pj_mfe_assignements
    restart: unless-stopped
    networks:
      - shogun

  mfe-users:
    build:
      context: ../frontend/pj-studies-users
      dockerfile: Dockerfile
    container_name: pj_mfe_users
    restart: unless-stopped
    networks:
      - shogun

  files:
    image: nginx:alpine
    container_name: pj_files
    restart: unless-stopped
    volumes:
      - ../backend/files:/usr/share/nginx/html:ro
    networks:
      - shogun

  proxy:
    image: nginx:alpine
    container_name: pj_proxy
    restart: unless-stopped
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/public/assets:/usr/share/nginx/assets:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - shogun
    depends_on:
      - api
      - assignments-api
      - users-api
      - mfe-host
      - mfe-program
      - mfe-syllabi
      - mfe-assignements
      - mfe-users
      - files
      - keycloak

networks:
  shogun:
    name: shogun_network
    external: true  # siec tworzona przez docker-compose.databases.prod.yml