server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Manifesty i HTML – zawsze świeże
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statyczne assety z hashem – cache na rok (zmiana hasha = nowy URL)
    location ~* \.(js|css|wasm|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain application/javascript application/json text/css application/wasm;
}
