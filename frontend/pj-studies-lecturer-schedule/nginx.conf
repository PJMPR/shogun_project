server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location = /remoteEntry.json {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
  }

  # Hashed bundles can be cached permanently. A missing bundle must return 404;
  # serving index.html here produces an invalid text/html ES module response.
  location ~* \.(js|css|wasm|mjs)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain application/javascript application/json text/css application/wasm;
}
